CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# This sample uses USART1 for logs. Keep the board-level USB CDC/UF2 trigger
# off so USB enumeration does not add UDC log noise or timing jitter.
CONFIG_UF2_DFU_RESET=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_UART_LINE_CTRL=n
