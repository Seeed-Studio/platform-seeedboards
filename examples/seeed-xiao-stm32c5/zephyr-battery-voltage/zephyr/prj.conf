CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Battery voltage is measured without USB power. Keep the hardware UART log
# path and disable application-side USB/UF2 services.
CONFIG_UF2_DFU_RESET=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_UART_LINE_CTRL=n
