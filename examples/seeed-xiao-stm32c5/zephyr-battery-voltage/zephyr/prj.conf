CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# This sample logs on USART1. Keep board-level USB CDC/UF2 trigger disabled
# so the battery ADC log stays clean.
CONFIG_UF2_DFU_RESET=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_UART_LINE_CTRL=n
