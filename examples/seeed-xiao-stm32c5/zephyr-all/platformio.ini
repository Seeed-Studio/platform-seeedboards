; XIAO STM32C5 all-feature firmware with CAN FD A/B link test roles.

[platformio]
default_envs = xiao-c5-can-node-a

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-stm32c5
monitor_speed = 1000000
platform_packages = framework-zephyr@~3.40400.0

[env:xiao-c5-can-node-a]
extends = env
build_flags = -DCAN_TEST_NODE=1

[env:xiao-c5-can-node-b]
extends = env
build_flags = -DCAN_TEST_NODE=2
