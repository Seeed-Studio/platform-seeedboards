; XIAO STM32C5 gs_usb (CANnectivity) USB<->CAN bridge — firmware A
; FDCAN2: PB5/PB13, on-board transceiver. Appears as a NATIVE SocketCAN
; interface on Linux: VID 0x1209:PID 0xCA01 is in the kernel gs_usb id_table,
; so `modprobe gs_usb` auto-binds -> can0. python-can interface=gs_usb.
;
; This firmware OWNS the USB device stack (vendor-class gs_usb), so the board's
; CDC ACM + 1200-bps UF2 trigger are disabled here. Flash via double-tap RESET
; into the XIAOC5BOOT UF2 volume (no CDC 1200-bps touch).
;
; Platform = the LOCAL platform (in-place via symlink) so the generalized
; module-copy block in builder/frameworks/zephyr.py + the vendored CANnectivity
; module under zephyr/modules/cannectivity/ take effect. Once that zephyr.py
; change + the cannectivity module land on the add_xiao_c5_support branch,
; switch this back to:
;   platform = https://github.com/cumin777/platform-seeedboards.git#add_xiao_c5_support

[env:seeed-xiao-stm32c5]
platform = symlink://D:/workspace/platform-seeedboards
framework = zephyr
board = seeed-xiao-stm32c5
platform_packages = framework-zephyr@~3.40400.0
