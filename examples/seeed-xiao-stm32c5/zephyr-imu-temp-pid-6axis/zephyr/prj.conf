# XIAO STM32C5 onboard IMU temperature PID + 6-axis interrupt sample
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PWM=y

# LSM6DS3TR-C uses the LSM6DSL-compatible driver.
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
CONFIG_LSM6DSL_THREAD_STACK_SIZE=1024
CONFIG_LSM6DSL_THREAD_PRIORITY=10

# Keep accel/gyro ODR and full-scale selectable at runtime.
CONFIG_LSM6DSL_ACCEL_ODR=0
CONFIG_LSM6DSL_ACCEL_FS=0
CONFIG_LSM6DSL_GYRO_ODR=0
CONFIG_LSM6DSL_GYRO_FS=0

# USB CDC ACM console for test output.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB CDC ACM console and 1200-bps UF2 reset trigger.
CONFIG_UF2_DFU_RESET=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
