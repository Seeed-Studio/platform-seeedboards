# GPIO for LED status before entering low power
CONFIG_GPIO=y

# Serial console for test status output
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# This sample measures MCU Sleep current through USART1 logs only.
CONFIG_UF2_DFU_RESET=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_UART_LINE_CTRL=n
