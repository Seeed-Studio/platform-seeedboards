# GPIO for LED status before entering low power
CONFIG_GPIO=y

# USB CDC ACM console for test status output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB CDC ACM console and 1200-bps UF2 reset trigger.
CONFIG_CDC_TOUCH_DFU=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
