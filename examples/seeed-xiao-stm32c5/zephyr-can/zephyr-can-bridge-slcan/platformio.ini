; XIAO STM32C5 SLCAN/LAWICEL USB<->CAN/CAN FD bridge
; FDCAN2: PB5 RX / PB13 TX, on-board transceiver STB = PB14
; SavvyCAN default: 500 kbit/s nominal, CAN FD enabled, 2 Mbit/s data
;
; NOTE: platform URL points at the branch carrying the STM32C5 board definition +
; PR#105957 USB HAL2 override. Update it when C5 support lands upstream.

[env:seeed-xiao-stm32c5]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-stm32c5
monitor_speed = 115200
platform_packages = framework-zephyr@~3.40400.0
