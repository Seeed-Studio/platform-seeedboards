; XIAO STM32C5 two-board CAN round-trip test.
; Same image on TWO XIAO boards (no USB-CAN, no UART). Role typed over USB CDC:
;   Board A:  init  <nominal> <data> <can|fd|fd-brs> [count] [fps]   (initiator)
;   Board B:  reply <nominal> <data> <can|fd|fd-brs>                (responder)
; A sends on 0x504, B echoes on 0x505, A verifies byte-exact round trip -> PASS/FAIL.
;
; FDCAN2: PB5 RX / PB13 TX, on-board transceiver STB = PB14 (managed by can_phy0).
; Interaction = USB CDC ACM on USB-C (PA11/PA12), so a board with a broken UART
; TX (PA9) is still usable. CDC plumbing mirrors zephyr-usb-cdc-echo-1m.
; monitor_speed is host CDC line coding only (USB-FS physical rate is fixed).
;
; Carries the PSIS=100MHz overlay (zephyr/app.overlay) to reproduce the exact
; clock under which zephyr-canfd-data-stress-psis100 fails at 1M/1M and 500k/5M.
;
; Platform = LOCAL (in-place via symlink) so the board DTS + generalized zephyr.py
; + PR#105957 USB HAL2 override on c5_main_integration take effect (matches gsusb).

[env:seeed-xiao-stm32c5]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-stm32c5
monitor_speed = 115200
platform_packages = framework-zephyr@~3.40400.0
