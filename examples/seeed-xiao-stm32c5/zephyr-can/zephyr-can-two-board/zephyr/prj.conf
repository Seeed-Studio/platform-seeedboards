# XIAO STM32C5 two-board CAN round-trip test (USB CDC ACM interaction).

# CAN core + FD
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_STATS=y
CONFIG_STATS=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_GPIO=y

# USB CDC ACM host-facing pipe (mirrors zephyr-usb-cdc-echo-1m / -can-bridge-slcan)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# The board's UF2 helper owns USB device init + keeps the 1200-bps UF2 trigger.
CONFIG_UF2_DFU_RESET=y

# runtime stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
