# ---- CANnectivity (gs_usb) over USB device_next stack ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_GS_USB=y

# CAN controller (board FDCAN2 via the zephyr,canbus chosen node)
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# gs_usb auto-bind VID/PID (Linux gs_usb host driver + python-can gs_usb backend)
CONFIG_CANNECTIVITY_USB_VID=0x1209
CONFIG_CANNECTIVITY_USB_PID=0xca01

# CANnectivity OWNS the USB device stack — disable the board's CDC ACM and the
# UF2 1200-bps CDC trigger so they don't double-initialize USB. Flash via RESET.
# CONFIG_USBD_CDC_ACM_CLASS is not set
# CONFIG_UART_LINE_CTRL is not set
# CONFIG_UF2_DFU_RESET is not set

# Optional app features whose sources are not vendored into this example.
# CONFIG_CANNECTIVITY_LED is not set
# Hardware timestamps would need app/src/timestamp-uptime.c vendored; gs_usb
# works without them (host just gets no SW timestamps).
# CONFIG_CANNECTIVITY_TIMESTAMP_COUNTER is not set
# CONFIG_CANNECTIVITY_TIMESTAMP_UPTIME is not set

CONFIG_LOG=y
CONFIG_CANNECTIVITY_LOG_LEVEL_INF=y
CONFIG_USBD_GS_USB_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
