CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# This sample intentionally does not use the CAN controller. Keep board-level
# USB CDC/UF2 app services disabled so the GPIO test log stays clean.
CONFIG_UF2_DFU_RESET=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_UART_LINE_CTRL=n
