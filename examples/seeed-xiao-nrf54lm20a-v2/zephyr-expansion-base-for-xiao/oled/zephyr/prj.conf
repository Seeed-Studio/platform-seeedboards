CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Keep detailed logs only for the display and I2C paths under investigation.
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_CHARACTER_FRAMEBUFFER=y
