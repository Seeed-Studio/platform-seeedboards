# Enable I2C driver
CONFIG_I2C=y
# Enable RTC framework
CONFIG_RTC=y
# Enable PCF8563 RTC specific driver
CONFIG_RTC_PCF8563=y

# Keep console output on the board-default USB CDC ACM device.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
