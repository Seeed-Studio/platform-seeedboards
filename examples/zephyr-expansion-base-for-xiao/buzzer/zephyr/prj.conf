CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SERIAL=n
# The board routes the console through a UART device (uart20 on V1.0, the
# USB CDC ACM port on V2.0), and the board's UART_CONSOLE default follows
# CONSOLE -- disabling SERIAL alone no longer removes the console backend,
# which then references a UART device no driver instantiates and fails to
# link. Turn the console off explicitly.
CONFIG_CONSOLE=n
CONFIG_PWM=y
CONFIG_PWM_LOG_LEVEL_DBG=y
