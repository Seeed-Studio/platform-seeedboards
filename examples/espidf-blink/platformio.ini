; PlatformIO Project Configuration File
;
; ESP-IDF smoke example for the espidf framework path. Two envs cover both
; toolchain families: RISC-V (esp32c3) and Xtensa (esp32s3). CI builds all
; envs in this file via scripts/ci/build_espidf_examples.py.

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = espidf
monitor_speed = 115200

[env:seeed-xiao-esp32-c3]
board = seeed-xiao-esp32-c3

[env:seeed-xiao-esp32-s3-sense]
board = seeed-xiao-esp32-s3-sense
