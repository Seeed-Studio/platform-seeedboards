; XIAO nRF54LM20B custom idle/move model generated by Nordic Edge AI Lab.
[env:seeed-xiao-nrf54lm20b]
platform = https://github.com/Seeed-Studio/platform-seeedboards
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
board_build.zephyr.app_build_control = true
; Sources are listed explicitly by zephyr/CMakeLists.txt.
build_src_filter = -<*>
