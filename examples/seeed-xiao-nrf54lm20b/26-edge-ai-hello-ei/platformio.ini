; PlatformIO Project Configuration File
; XIAO nRF54LM20B Edge AI — hello Edge Impulse (Axon NPU, C++, sample 26)
;
; Runs the official Edge Impulse "hello_ei" sample with an Axon-accelerated
; model. Needs the Edge Impulse SDK (edge-impulse-sdk-zephyr, fetched by the
; platform builder) and C++. Console stays on the board-default USB CDC ACM.
; The official hello_ei main.c lives outside PROJECT_DIR, so the app target is
; built from the CMake model (board_build.zephyr.app_build_control).
[env:seeed-xiao-nrf54lm20b]
platform = file://D:/workspace/xiao_nrf54lm20b/platform-seeedboards
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
board_build.zephyr.app_build_control = true
