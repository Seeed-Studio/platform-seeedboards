# XIAO nRF54LM20B Edge AI — hello Edge Impulse (Axon NPU, C++).
# Official Axon-accelerated Edge Impulse model. Console on board-default USB
# CDC ACM (keeps 1200-bps DFU working); no console redirect needed here.

# C++ runtime (Edge Impulse SDK is C++; main.c calls it via C linkage)
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FP16=n
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=2048

# Axon NPU driver + the official Edge Impulse model
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=36
CONFIG_NRF_AXON_MODEL_NAME="ei_model_nrf_accel_sim_54"

# Edge Impulse SDK Zephyr module (platform builder fetches edge-impulse-sdk-zephyr)
CONFIG_EDGE_IMPULSE_SDK=y

# nRF Edge AI runtime deps
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y

# Sample-local input buffer
CONFIG_HELLO_EI_DATA_BUF_SIZE=512

CONFIG_GPIO=y

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
