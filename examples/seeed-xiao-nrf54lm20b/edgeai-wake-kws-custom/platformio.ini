; XIAO nRF54LM20B — custom Nordic Edge AI Lab wake word + KWS (Axon NPU)
;
; Before the first build, install both generated Axon model directories as
; described in README.md. This project deliberately contains no trained model.
[env:seeed-xiao-nrf54lm20b]
platform = https://github.com/Seeed-Studio/platform-seeedboards
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
; Model sources are selected by zephyr/CMakeLists.txt (custom model or fallback).
board_build.zephyr.app_build_control = true
; Keep generated model C files out of PlatformIO's automatic src scan. CMake
; adds exactly the selected WW/KWS package (custom or sample-23 fallback).
build_src_filter = +<*> -<ww/nrf_edgeai_generated/> -<kws/nrf_edgeai_generated/>
