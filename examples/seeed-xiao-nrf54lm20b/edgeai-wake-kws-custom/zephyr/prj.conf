# XIAO nRF54LM20B custom wake word + KWS — Nordic Edge AI Lab Axon models.

# Runtime and Axon NPU.
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# Replace these values with the maximum requirements of the two exported Axon
# models. The initial values permit the bundled reference model only; they are
# intentionally not a guarantee for a custom model.
# The KWS export (solution 95649) needs 6656 bytes; WW needs 6048 bytes.
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6656
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# On-board PDM microphone and its nPM1300 power path.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_GPIO=y

# Apply the board's nPM1300 charger settings at boot, including the 500 mA
# VBUS input-current limit needed to tolerate the microphone LDO1 turn-on.
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y

# USB CDC logging.
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# Default to the two-stage local mode, without Bluetooth.
CONFIG_APP_MODE_WW_GATED_KWS=y
CONFIG_KWS_PERIOD_MS=10000
