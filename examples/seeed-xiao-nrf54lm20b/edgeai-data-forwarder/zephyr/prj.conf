# XIAO nRF54LM20B Nordic Edge AI Data Forwarder.

CONFIG_DATA_FWD_PROTO=y
CONFIG_DATA_FWD_PROTO_CRC=y
CONFIG_DATA_FWD_PROTO_INT32_VALUES=y
CONFIG_DATA_FWD_TRANSPORT_UART=y
CONFIG_DATA_FWD_SENSOR_LSM6DSL=y
CONFIG_DATA_FWD_PROTO_MAX_CHANNELS=6

CONFIG_ZCBOR=y
CONFIG_COBS=y
CONFIG_CRC=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y

# Keep the USB CDC port dedicated to Data Forwarder frames. Diagnostics use RTT.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
