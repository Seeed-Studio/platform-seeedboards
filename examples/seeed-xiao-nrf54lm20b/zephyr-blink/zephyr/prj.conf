CONFIG_GPIO=y

# USB CDC ACM console is enabled by the board's cdc_acm_serial defconfig
# (SERIAL/CONSOLE/UART_CONSOLE/USB_DEVICE_STACK_NEXT/CDC_ACM_SERIAL_INITIALIZE_AT_BOOT
# all default y). printk() goes to the USB CDC ACM port (cdc_acm_uart).
# Keep SERIAL=y so the cdc_acm_uart device instantiates and uart_console links.
