CONFIG_GPIO=y

# USB CDC ACM console: enabled by the board's cdc_acm_serial defconfig
# (SERIAL/CONSOLE/UART_CONSOLE/USB_DEVICE_STACK_NEXT/CDC_ACM_SERIAL_INITIALIZE_AT_BOOT
# all default y). printk() goes to the USB CDC ACM port (cdc_acm_uart).
# The app also serves as the 1200-bps DFU trigger target (xiao_dfu_reset module).
# Keep SERIAL=y so the cdc_acm_uart device instantiates (otherwise uart_console
# fails to link: __device_dts_ord_164).
