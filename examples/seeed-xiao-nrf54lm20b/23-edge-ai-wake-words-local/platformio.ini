; PlatformIO Project Configuration File
; XIAO nRF54LM20B Edge AI — wakeword + keyword spotting (LOCAL, sample 23)
;
; Runs the Axon wake-word and keyword-spotting models over the onboard PDM mic
; and logs the results to the console (USB CDC). Bluetooth reporting (BLE NUS)
; is removed for this local-detection build, so no NCS Bluetooth dependency.
; All sources live under PROJECT_DIR/src (incl. ww/ and kws/ subdirs) and are
; compiled by PlatformIO's recursive source glob.
[env:seeed-xiao-nrf54lm20b]
platform = https://github.com/cumin777/platform-seeedboards.git#xiao_nrf54lm20b_main_integration
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
