# XIAO nRF54LM20B Edge AI — wakeword + keyword spotting (LOCAL, no Bluetooth).
# Axon NPU runs the wake-word and keyword-spotting models over the onboard PDM
# mic; results are logged to the console (USB CDC). Console stays on the
# board-default USB CDC ACM so the 1200-bps DFU trigger keeps working. Bluetooth
# (BLE NUS) reporting is intentionally removed.

# nRF Edge AI runtime + Axon NPU driver
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6656
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# PDM microphone + nPM1300 LDO1 power path (board-supported)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_GPIO=y

# Logging — DEFERRED (not immediate). Immediate mode overflows the USB UDC
# thread's 512-byte stack at boot under GCC 8.2.1 (see sample 25 notes).
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# Keyword-spotting window after the wake word: 10 s (default 3 s).
CONFIG_KWS_PERIOD_MS=10000
