# XIAO nRF54LM20B Edge AI — gesture recognition (LOCAL, no Bluetooth).
# Axon NPU runs the gesture model over the onboard LSM6DSL IMU; detected
# gestures are logged to the console (USB CDC). Console stays on the
# board-default USB CDC ACM (AT control port + 1200-bps DFU). BLE HID reporting
# is removed via CONFIG_BLE_MODE_NONE, so there is no Bluetooth/NCS-BT dependency.

# nRF Edge AI runtime + Axon gesture model
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_EDGEAI_GESTURE_RECOGNITION_MODEL_AXON=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=512

# XIAO nRF54LM20B peripherals: IMU (LSM6DSL) + nPM1300 LDO1 power path
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# Runtime settings are selected by src/imu_lsm6dsl.c.
CONFIG_LSM6DSL_ACCEL_FS=0
CONFIG_LSM6DSL_ACCEL_ODR=0
CONFIG_LSM6DSL_GYRO_FS=0
CONFIG_LSM6DSL_GYRO_ODR=0
CONFIG_PWM=y

# Logging — DEFERRED (not immediate). Immediate mode overflows the USB UDC
# thread's 512-byte stack at boot under GCC 8.2.1 (see sample 25 notes).
CONFIG_LOG=y
CONFIG_ASSERT=y

# Local-detection mode: no Bluetooth.
CONFIG_BLE_MODE_NONE=y

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
