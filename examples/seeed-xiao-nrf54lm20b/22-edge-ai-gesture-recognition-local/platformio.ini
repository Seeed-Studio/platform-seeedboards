; PlatformIO Project Configuration File
; XIAO nRF54LM20B Edge AI — gesture recognition (LOCAL, sample 22)
;
; Runs the official Axon gesture model over the onboard LSM6DSL IMU and logs the
; detected gesture to the console (USB CDC). BLE HID reporting is removed
; (CONFIG_BLE_MODE_NONE), so there is no NCS Bluetooth dependency. The official
; gesture_recognition sources (under the sdk-edge-ai module) are external, so
; the app target is built from the CMake model (board_build.zephyr.app_build_control).
[env:seeed-xiao-nrf54lm20b]
platform = file://D:/workspace/xiao_nrf54lm20b/platform-seeedboards
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
board_build.zephyr.app_build_control = true
