# XIAO nRF54LM20B Edge AI — Axon parcel-state classification.
# Official nRF Edge AI Runtime classifier, NPU variant, ported to PIO.
#
# Console stays on the board-default USB CDC ACM (cdc_acm_uart): the board's
# cdc_acm_serial defconfig already enables SERIAL/CONSOLE/UART_CONSOLE/USB, so
# no console config is needed here and the 1200-bps DFU trigger keeps working.

# nRF Edge AI runtime + Axon NPU model
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_EDGEAI_CLASSIFICATION_MODEL_AXON=y

# nRF Edge AI runtime dependencies (NRF_EDGEAI depends on these)
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# Axon model buffers (values generated with the official Axon model)
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=344
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# main.c logs via LOG_*; routed to the USB CDC console.
CONFIG_LOG=y
CONFIG_GPIO=y

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
