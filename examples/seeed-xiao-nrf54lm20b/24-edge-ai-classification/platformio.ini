; PlatformIO Project Configuration File
; XIAO nRF54LM20B Edge AI — Axon parcel-state classification (sample 24)
;
; Reuses Nordic's official nRF Edge AI classification sample (Axon NPU variant)
; and runs it on the XIAO nRF54LM20B NPU. Console stays on the board-default
; USB CDC ACM so the 1200-bps DFU trigger keeps working.
; The platform builder auto-detects edge-AI samples from prj.conf and pulls in
; the sdk-edge-ai module, so no extra_scripts are needed.
[env:seeed-xiao-nrf54lm20b]
platform = file://D:/workspace/xiao_nrf54lm20b/platform-seeedboards
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
; This sample builds the OFFICIAL edge-ai classification sources (main.c + the
; generated Axon model .c) which live outside PROJECT_DIR. PlatformIO by default
; ignores the Zephyr `app` target and only globs PROJECT_DIR/src/*.c, which would
; drop those external sources. Letting PlatformIO build the app target from the
; CMake model compiles every external target_sources() entry.
board_build.zephyr.app_build_control = true
