# XIAO nRF54LM20B Edge AI — offline person detection (Axon NPU).
# Nordic person_det model executed by the Axon NPU over two embedded images.
# No camera. Console on the board-default USB CDC ACM (cdc_acm_uart): the board
# defconfig already enables SERIAL/CONSOLE/USB, so the 1200-bps DFU trigger
# keeps working and no console redirect is needed here.

# Axon NPU driver + model buffers (person_det needs a 224 KiB interlayer buffer)
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=229376
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# nRF Edge AI runtime dependencies
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# Logging: DEFERRED (not immediate). Immediate mode (CONFIG_LOG_MODE_IMMEDIATE)
# outputs logs synchronously in the calling thread's context; at boot that made
# the USB UDC thread overflow its 512-byte stack (CONFIG_UDC_DWC2_STACK_SIZE)
# during log formatting -> USAGE FAULT / stack overflow before main(). Deferred
# mode formats logs in the dedicated log thread (sized below) instead.
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_GPIO=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048

# Sample-local thresholds (per-mille)
CONFIG_SCORE_THRESHOLD=250
CONFIG_IOU_THRESHOLD=450

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
