; PlatformIO Project Configuration File
; XIAO nRF54LM20B Edge AI — offline person detection (Axon NPU, sample 25)
;
; Reuses Nordic's official person_detection application and runs the Axon
; person-det model over two embedded public-domain images (no camera needed).
; Console stays on the board-default USB CDC ACM so the 1200-bps DFU trigger
; keeps working. The platform builder auto-detects edge-AI samples (CONFIG_NRF_AXON)
; and pulls in the sdk-edge-ai module.
[env:seeed-xiao-nrf54lm20b]
platform = https://github.com/cumin777/platform-seeedboards.git#xiao_nrf54lm20b_main_integration
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
; This sample adds the official edge-ai sources (postprocessing.c, etc.) to the
; Zephyr `app` target via target_sources(). PlatformIO by default ignores the
; app target and only globs PROJECT_DIR/src/*.c*, which would drop those
; external sources. Letting PlatformIO build the app target from the CMake
; model compiles every target_sources() entry (internal + external edge-ai).
board_build.zephyr.app_build_control = true
