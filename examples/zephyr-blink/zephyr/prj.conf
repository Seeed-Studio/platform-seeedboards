CONFIG_GPIO=y
CONFIG_SERIAL=n

# Baseline-only: board default console is USB CDC ACM (cdc_acm_uart), but with
# SERIAL=n above that device isn't instantiated and uart_console fails to link
# (__device_dts_ord_164). Blink needs no console, so disable it for the baseline.
# USB CDC (log output + mcumgr USB recovery, coexisting) configured in DFU phase.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
