name: CI Verify

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/ci-verify.yml'
      - 'platform.json'
      - 'platform.py'
      - 'boards/**'
      - 'builder/**'
      - 'platform_cfg/**'
      - 'zephyr/**'
      - 'scripts/ci/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/ci-verify.yml'
      - 'platform.json'
      - 'platform.py'
      - 'boards/**'
      - 'builder/**'
      - 'platform_cfg/**'
      - 'zephyr/**'
      - 'scripts/ci/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  verify:
    name: Offline gates (pytest / verify / boards smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-verify-${{ hashFiles('.github/workflows/ci-verify.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-verify-

      - name: Install dependencies
        run: python -m pip install --upgrade pip platformio pytest

      - name: Run unit tests
        # NOTE: use the pytest console script, NOT `python -m pytest` -- the
        # repo root contains platform.py (PlatformIO platform requirement)
        # and `python -m` puts CWD on sys.path, shadowing the stdlib
        # `platform` module for platformio's requests/urllib3 import chain.
        run: pytest tests/ -q

      - name: Run board manifest gate
        run: python scripts/ci/verify_boards.py

      - name: Run zephyr routing gate
        run: python scripts/ci/verify_zephyr_routing.py

      - name: Run pio boards listing smoke
        run: python scripts/ci/smoke_pio_boards.py
