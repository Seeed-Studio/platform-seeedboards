name: CI Verify

on:
  push:
    branches: [v3, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        # console script: once platform.py exists, python -m pytest would
        # shadow the stdlib platform module via cwd
        run: pytest tests/ -q

      - name: Run board manifest gate
        run: python scripts/ci/verify_boards.py

      - name: Run core routing gate
        run: python scripts/ci/verify_core.py

      - name: Run zephyr routing and fixes gate
        run: python scripts/ci/verify_zephyr_routing.py