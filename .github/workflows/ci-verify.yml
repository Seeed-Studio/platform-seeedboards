name: CI Verify

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Offline gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        # console script: once platform.py lands, python -m pytest would
        # shadow the stdlib platform module via cwd
        run: pytest tests/ -q

      - name: Run board manifest gate
        run: python scripts/ci/verify_boards.py
