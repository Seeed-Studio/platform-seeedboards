name: Sourcery review

# AI code review from https://www.sourcery.ai over the lines a pull
# request changes:
#
#   * Runs for every PR (opened, new commits, reopened) and reviews only
#     the diff against the PR base, not the whole tree.
#   * Advisory only: Sourcery findings are reported in the job log but
#     never fail the job, so this workflow cannot block a merge.
#   * No Sourcery login: the CLI reviews open-source repositories
#     anonymously (the repository is authorized through the Sourcery
#     GitHub App). If this repository ever becomes private, this job
#     will fail with a login prompt -- that is the signal to add a
#     token-based setup back.
#   * workflow_dispatch accepts an open PR number so PRs that predate
#     this workflow can still be reviewed on demand.
#
# Both automatic and manual runs check out the PR merge ref
# (refs/pull/<n>/merge), so the review always sees the PR as it would
# land on its current base branch.
#
# The CLI is installed from PyPI on every run instead of going through
# sourcery-ai/action@v1: that action's v1 tag still installs the
# abandoned "sourcery-cli" package and its mandatory `sourcery login`
# step, which this workflow deliberately avoids.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sourcery-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Sourcery AI review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve PR base (manual run)
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json baseRefOid --jq '"base_sha=\(.baseRefOid)"' >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the merge ref exists for open PRs regardless of fork origin;
          # full history lets Sourcery diff against the PR base
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/merge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sourcery CLI
        run: python3 -m pip install sourcery

      - name: Run Sourcery review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base_sha }}
        run: sourcery review --verbose --diff="git diff $BASE_SHA" .
