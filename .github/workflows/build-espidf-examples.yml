name: Build ESP-IDF Examples

on:
  push:
    branches: [main, develop]
    paths: &espidf_paths
      - '.github/workflows/build-espidf-examples.yml'
      - 'platform.json'
      - 'platform.py'
      - 'boards/**'
      - 'builder/**'
      - 'families/**'
      - 'zephyr/**'
      - 'examples/**'
      - 'scripts/ci/**'
  pull_request:
    paths: *zephyr_paths
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio pytest

      - name: Run offline gates
        run: |
          pytest tests/ -q
          python scripts/ci/verify_boards.py
          python scripts/ci/verify_core.py
          python scripts/ci/verify_zephyr_routing.py

      - name: Build ESP-IDF examples (all demos, all boards)
        run: |
          # CI rewrites the platform URL to the local checkout and
          # builds every espidf demo env (the framework tarball and
          # toolchain expansions make the first run slow)
          python scripts/ci/build_examples.py --framework espidf
