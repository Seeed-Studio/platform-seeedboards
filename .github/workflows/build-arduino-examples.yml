name: Build Arduino Examples

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/build-arduino-examples.yml'
      - 'platform.json'
      - 'platform.py'
      - 'boards/**'
      - 'builder/**'
      - 'families/**'
      - 'frameworks/arduino.py'
      - 'platform_cfg/**'
      - 'scripts/ci/_examples_build_lib.py'
      - 'scripts/ci/build_arduino_examples.py'
      - 'examples/arduino-*/**'
  pull_request:
    paths:
      - '.github/workflows/build-arduino-examples.yml'
      - 'platform.json'
      - 'platform.py'
      - 'boards/**'
      - 'builder/**'
      - 'families/**'
      - 'frameworks/arduino.py'
      - 'platform_cfg/**'
      - 'scripts/ci/_examples_build_lib.py'
      - 'scripts/ci/build_arduino_examples.py'
      - 'examples/arduino-*/**'
  workflow_dispatch:

jobs:
  build-arduino-examples:
    name: PlatformIO Build (examples / arduino)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/build-arduino-examples.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO (upstream platform & packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          # Keyed on the package matrix and the upstream lock, NOT on
          # platform source files: a PR touching builder code must not
          # invalidate the multi-hundred-MB platform/package cache and
          # force a fresh upstream git clone every run.
          key: ${{ runner.os }}-pio-pkgs-${{ hashFiles('platform.json', 'families/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pio-pkgs-

      - name: Cache PlatformIO (core tools)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/tools
          key: ${{ runner.os }}-platformio-${{ hashFiles('.github/workflows/build-arduino-examples.yml') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Run unit tests (incl. upstream anchor sentinels)
        run: |
          python -m pip install pytest
          pytest tests/ -q

      - name: Build Arduino examples (all envs)
        run: python scripts/ci/build_arduino_examples.py --log-dir .pio-ci-logs/arduino --quiet

      - name: Upload Arduino build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pio-logs-arduino
          path: .pio-ci-logs/arduino
          if-no-files-found: ignore
