name: Build Arduino Examples

on:
  push:
    branches: [v3, main, develop]
    paths: &arduino_paths
      - '.github/workflows/build-arduino-examples.yml'
      - 'platform.json'
      - 'platform.py'
      - 'boards/**'
      - 'builder/**'
      - 'families/**'
      - 'examples/**'
      - 'scripts/ci/**'
      - 'requirements-ci.txt'
  pull_request:
    paths: *arduino_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arduino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platform.json', 'requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements-ci.txt

      - name: Run offline gates
        run: |
          pytest tests/ -q
          python scripts/ci/verify_boards.py
          python scripts/ci/verify_core.py
          python scripts/ci/verify_zephyr_routing.py
          python scripts/ci/verify_platform.py
          python scripts/ci/verify_examples.py
          python scripts/ci/verify_workflows.py

      - name: Build Arduino examples (all demos, all boards)
        run: |
          # CI rewrites the platform URL to the local checkout and
          # builds every arduino demo env
          python scripts/ci/build_examples.py --framework arduino --log-dir pio-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pio-logs-arduino
          path: pio-logs
          if-no-files-found: ignore