name: Check Board Manifests

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/check-board-manifests.yml'
      - 'boards/**'
      - 'platform.py'
      - 'platform_cfg/**'
      - 'builder/**'
      - 'zephyr/fixes.yml'
      - 'scripts/ci/verify_board_manifests.py'
  pull_request:
    paths:
      - '.github/workflows/check-board-manifests.yml'
      - 'boards/**'
      - 'platform.py'
      - 'platform_cfg/**'
      - 'builder/**'
      - 'zephyr/fixes.yml'
      - 'scripts/ci/verify_board_manifests.py'
  workflow_dispatch:

jobs:
  check-board-manifests:
    name: Static board manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Optional dependency: enables the R6 fixes.yml cross-check. The
      # checker degrades gracefully when PyYAML is absent.
      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Verify board manifests
        run: python scripts/ci/verify_board_manifests.py
