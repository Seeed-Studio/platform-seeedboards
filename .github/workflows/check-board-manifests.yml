name: Check Board Manifests

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/check-board-manifests.yml'
      - 'boards/**'
      - 'platform.py'
      - 'platform_cfg/**'
      - 'builder/**'
      - 'scripts/ci/verify_board_manifests.py'
  pull_request:
    paths:
      - '.github/workflows/check-board-manifests.yml'
      - 'boards/**'
      - 'platform.py'
      - 'platform_cfg/**'
      - 'builder/**'
      - 'scripts/ci/verify_board_manifests.py'
  workflow_dispatch:

# Static checks on checkout; read-only token is all they need.
permissions:
  contents: read

jobs:
  check-board-manifests:
    name: Static board manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Verify board manifests
        run: python scripts/ci/verify_board_manifests.py
