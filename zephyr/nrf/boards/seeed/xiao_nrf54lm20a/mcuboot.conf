#
# MCUboot configuration for the XIAO nRF54LM20A V2.0 board. This records
# the configuration of the factory USB firmware-loader bootloader
# (USB_DFU.hex, a firmware-team deliverable) so the platform's application
# signing pipeline can produce matching images: applications are signed
# with `--pure` (IMAGE_TLV_PURE, 0x25) using the factory Ed25519 key
# (root-ed25519.pem), and MCUboot chainloads the slot1 USB MCUmgr loader
# for DFU recovery. Rebuilding the bootloader itself is not part of the
# PlatformIO build (users update applications over USB DFU only).

# ── Firmware-loader recovery ──

# MCUboot validates slot0 then chainloads the USB MCUmgr firmware-loader
# in slot1 when button entry or a missing application requires DFU.
CONFIG_BOOT_FIRMWARE_LOADER=y
CONFIG_BOOT_FIRMWARE_LOADER_ENTRANCE_GPIO=y
CONFIG_BOOT_FIRMWARE_LOADER_NO_APPLICATION=y

# ── Partition & Flash Config ──

# nRF54LM20 has more flash sectors than typical nRF boards.
CONFIG_BOOT_MAX_IMG_SECTORS=512

# ── Signing ──

# Match the PIO app signer and the factory loader. `--pure` causes imgtool
# to emit IMAGE_TLV_PURE (0x25), required by this MCUboot validation mode.
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_TYPE_PURE=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-ed25519.pem"
