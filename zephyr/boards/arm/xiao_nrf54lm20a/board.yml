board:
  name: xiao_nrf54lm20a
  full_name: XIAO nRF54LM20A
  vendor: seeed
  revision:
    format: major.minor.patch
    default: "1.0.0"
    revisions:
      - name: "1.0.0"
      - name: "2.0.0"
  socs:
  - name: nrf54lm20a
    variants:
    - name: xip
      cpucluster: cpuflpr
runners:
  run_once:
    '--recover':
    - runners:
      - nrfjprog
      - nrfutil
      run: first
      groups:
      - boards:
        - xiao_nrf54lm20a/nrf54lm20a/cpuapp
        - xiao_nrf54lm20a/nrf54lm20a/cpuflpr
        - xiao_nrf54lm20a/nrf54lm20a/cpuflpr/xip
    '--erase':
    - runners:
      - nrfjprog
      - jlink
      - nrfutil
      run: first
      groups:
      - boards:
        - xiao_nrf54lm20a/nrf54lm20a/cpuapp
        - xiao_nrf54lm20a/nrf54lm20a/cpuflpr
        - xiao_nrf54lm20a/nrf54lm20a/cpuflpr/xip
    '--reset':
    - runners:
      - nrfjprog
      - jlink
      - nrfutil
      run: last
      groups:
      - boards:
        - xiao_nrf54lm20a/nrf54lm20a/cpuapp
        - xiao_nrf54lm20a/nrf54lm20a/cpuflpr
        - xiao_nrf54lm20a/nrf54lm20a/cpuflpr/xip
