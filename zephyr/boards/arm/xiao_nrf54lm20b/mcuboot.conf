# MCUboot configuration for XIAO nRF54LM20B board.
# This file is automatically loaded by Zephyr sysbuild when building
# for this board with MCUboot enabled.

# ── Firmware-loader recovery ──

# Match the shipped USB_DFU.hex: MCUboot validates slot0 then chainloads the
# USB MCUmgr firmware-loader in slot1 when button entry or no app requires DFU.
CONFIG_BOOT_FIRMWARE_LOADER=y
CONFIG_BOOT_FIRMWARE_LOADER_ENTRANCE_GPIO=y
CONFIG_BOOT_FIRMWARE_LOADER_NO_APPLICATION=y

# ── Partition & Flash Config ──

# nRF54LM20 has more flash sectors than typical nRF boards.
CONFIG_BOOT_MAX_IMG_SECTORS=512

# ── Signing ──

# Match the PIO app signer and NCS USB_DFU.hex. `--pure` causes imgtool to
# emit IMAGE_TLV_PURE (0x25), required by this MCUboot validation mode.
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_TYPE_PURE=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-ed25519.pem"
